###############################################
# Kuadrat – Docker Compose: PRODUCTION (pre) env #
###############################################

# Usage (staging environment):
#   docker compose -f docker-compose.prod.yml up --build -d
#
# This is a standalone production configuration with security hardening.

services:
  api:
    build:
      context: ./api
      # Imagen de producción: `npm ci --omit=dev` (build reproducible, sin jest
      # ni nodemon dentro) y tini como PID 1 para que el SIGTERM llegue al
      # apagado ordenado. El `Dockerfile` sin sufijo es el de desarrollo.
      dockerfile: Dockerfile.prod
    container_name: kuadrat-api
    # Bind to localhost only - nginx will handle external traffic
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - ./api/.env
    # PRODUCTION: Only mount the uploads directory, not the entire app
    volumes:
      - /home/ubuntu/uploads:/app/uploads
    # Security: Run with limited privileges
    security_opt:
      - no-new-privileges:true
    # Restart policy for production
    restart: unless-stopped
    # Sin `command:`: el CMD de Dockerfile.prod ya es `node server.js`.
    networks:
      - kuadrat-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Límites de recursos.
    #
    # La máquina es una t4g.medium: 2 vCPU en total. La suma de los límites se
    # mantiene en 1.75 para que nginx —que termina TLS y ahora sirve el 98,8 %
    # del tráfico desde su caché— conserve ~0,25 vCPU garantizado.
    #
    # El reparto favorece a la API, y eso es lo contrario de lo que pedía la
    # primera medición. Entonces el cuello era el render de Next; hoy nginx
    # sirve lo cacheado sin tocar Node y el render ocurre una vez cada cinco
    # minutos por página. Medido con los límites por IP levantados:
    #
    #   API con consulta a Turso ...  50 req/s   ← el techo del tráfico real
    #   API sin base de datos ...... 188 req/s
    #   Página con acierto de ISR .. 108 req/s
    #   Acierto en la caché de nginx 4878 req/s
    #
    # La API es lo único que no se puede cachear (sirve stock de ediciones y
    # pujas), así que su techo es el techo del sitio. La comparación con
    # /health sitúa el freno en el trabajo por petición, no en la red.
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        - NEXT_PUBLIC_CART_ADDRESS_FUNC=${NEXT_PUBLIC_CART_ADDRESS_FUNC}
        - NEXT_PUBLIC_REVOLUT_LOCALE=${NEXT_PUBLIC_REVOLUT_LOCALE}
        - NEXT_PUBLIC_REVOLUT_MODE=${NEXT_PUBLIC_REVOLUT_MODE}
        - NEXT_PUBLIC_REVOLUT_PUBLIC_KEY=${NEXT_PUBLIC_REVOLUT_PUBLIC_KEY}
        - NEXT_PUBLIC_PAYMENT_TIMEOUT_MS=${NEXT_PUBLIC_PAYMENT_TIMEOUT_MS}
        - NEXT_PUBLIC_PAYMENT_PROVIDER=${NEXT_PUBLIC_PAYMENT_PROVIDER}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        - WEB_APP_HIDDEN=${WEB_APP_HIDDEN}
        - PUBLISHED_VISIBLE=${PUBLISHED_VISIBLE}
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
        - NEXT_PUBLIC_SENDCLOUD_ENABLED_ART=${NEXT_PUBLIC_SENDCLOUD_ENABLED_ART}
        - NEXT_PUBLIC_SENDCLOUD_ENABLED_OTHERS=${NEXT_PUBLIC_SENDCLOUD_ENABLED_OTHERS}
        - NEXT_PUBLIC_PAYMENT_ENABLED=${NEXT_PUBLIC_PAYMENT_ENABLED}
        - NEXT_PUBLIC_ART_BUY_AVAILABLE=${NEXT_PUBLIC_ART_BUY_AVAILABLE}
        - NEXT_PUBLIC_NEWSLETTER_ENABLED=${NEXT_PUBLIC_NEWSLETTER_ENABLED}
        - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV}
    image: kuadrat-client
    container_name: kuadrat-client
    # Bind to localhost only - nginx will handle external traffic
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    env_file:
      - ./client/.env
    # PRODUCTION: Use read-only filesystem with tmpfs for temporary files
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
      - /app/.next/cache:size=200M,mode=1777
    # Security: Run with limited privileges
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - kuadrat-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/galeria',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # El cliente baja a 0.5 porque su trabajo ya casi no ocurre: nginx cachea el
    # HTML y las variantes de imagen en disco, así que Next sólo interviene en
    # los fallos de caché. `proxy_cache_lock` colapsa además las peticiones
    # simultáneas de una misma URL en un único render, de modo que una avalancha
    # sobre caché fría no se traduce en N renders sino en uno.
    #
    # El caso que sí paga esta reducción es el primer visitante de una obra
    # recién publicada, cuyas variantes de imagen hay que generar (~0,6-1,2 s
    # por variante a 0.5 vCPU, una sola vez). Si eso llegara a molestar, este es
    # el valor que hay que subir — no el de la API. Ver la nota en `api`.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1500M
        reservations:
          cpus: '0.25'
          memory: 512M

networks:
  kuadrat-network:
    driver: bridge
