<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No disponible ahora mismo | 140d</title>
<!--
  Página de error de nginx. TIENE que ser autocontenida.

  Se sirve precisamente cuando el origen está saturado o caído, así que no puede
  depender de nada que haya que ir a buscar: ni fuentes de Google (la web usa
  Inter vía @import, aquí se imita con la pila del sistema), ni CSS, ni JS, ni
  imágenes. Una sola petición, resuelta desde disco por nginx, sin tocar Node.

  Estética alineada con el frontend: fondo blanco, texto gray-900 (#111827),
  minimalismo, es-ES.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    /* Pila del sistema elegida para parecerse a Inter sin descargar nada:
       -apple-system (SF) en Apple, Segoe UI Variable en Windows, Roboto en
       Android. Todas son grotescas neutras de proporciones similares. */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #111827;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  .marca {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #111827;
    text-decoration: none;
    margin-bottom: 56px;
  }
  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0 0 16px;
    max-width: 20ch;
    text-wrap: balance;
  }
  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #6b7280;
    margin: 0 auto 32px;
    max-width: 46ch;
  }
  .acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.boton {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .15s, border-color .15s;
  }
  a.principal { background: #111827; color: #ffffff; }
  a.principal:hover { background: #374151; }
  a.secundario { border: 1px solid #d1d5db; color: #111827; }
  a.secundario:hover { border-color: #9ca3af; }
  a:focus-visible { outline: 2px solid #111827; outline-offset: 2px; }
  footer {
    padding: 24px;
    text-align: center;
    font-size: 0.8125rem;
    color: #9ca3af;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main>
    <a class="marca" href="/">140d</a>
    <h1>La galería no está disponible ahora mismo</h1>
    <p>
      Estamos recibiendo más visitas de las que podemos atender en este momento.
      No es nada que hayas hecho tú: vuelve a intentarlo en unos segundos.
    </p>
    <div class="acciones">
      <a class="boton principal" href="">Reintentar</a>
      <a class="boton secundario" href="/">Ir al inicio</a>
    </div>
  </main>
  <footer>140d — Galería de arte</footer>
</body>
</html>
