# ─────────────────────────────────────────────────────────────────────────────
# Kuadrat — definiciones compartidas de nginx (contexto http)
#
# Destino: /etc/nginx/conf.d/00-kuadrat-shared.conf
#
# Zonas, upstreams y mapas viven en el contexto `http`, no dentro de un
# `server {}`. Por eso este fichero va en conf.d/ y no en sites-available/.
# El prefijo 00- garantiza que se cargue antes que cualquier otro.
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstreams con keepalive ──────────────────────────────────────────────────
# Sin `keepalive`, nginx abre y cierra una conexión TCP contra Node en CADA
# petición. Con 2 vCPU compartidos eso es puro desperdicio: el handshake compite
# con el render. Requiere HTTP/1.1 y Connection vacía hacia el upstream, que es
# lo que hace el mapa de abajo.
upstream kuadrat_client {
    server 127.0.0.1:3000;
    keepalive 64;
    keepalive_timeout 60s;
}

upstream kuadrat_api {
    server 127.0.0.1:3001;
    keepalive 64;
    keepalive_timeout 60s;
}

# ── Connection header ────────────────────────────────────────────────────────
# La configuración anterior ponía `Connection: upgrade` en TODAS las peticiones
# proxied. Eso rompe el keepalive contra el upstream para el 99,9 % del tráfico
# que no es un WebSocket. Este mapa deja la cabecera vacía salvo cuando el
# cliente pide de verdad un upgrade (Socket.IO de subastas y eventos).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── Rate limiting por IP ─────────────────────────────────────────────────────
# Los RITMOS no son un número redondo cualquiera: son lo que impide que una sola
# IP agote el camino SIN caché, que es el que de verdad cuesta. Medido con los
# límites levantados: una página que nginx no tiene cacheada topa en 108 req/s y
# la API en 50. Un atacante que añada una query aleatoria a cada URL evita la
# caché a propósito, así que a 30 r/s consume ~28 % del origen y hacen falta
# cuatro fuentes coordinadas para saturarlo. Subir estos ritmos es exactamente
# lo que permitiría a UNA máquina tumbar el sitio otra vez.
#
# Las RÁFAGAS sí se pueden ser generosas, y conviene: el App Router precarga los
# enlaces visibles, de modo que abrir la galería con doce obras en pantalla
# dispara una docena de peticiones de golpe. Con varias personas tras un mismo
# NAT (una oficina, el CGNAT de un operador móvil) una ráfaga de 60 se agota sin
# que nadie esté haciendo nada raro.
limit_req_zone  $binary_remote_addr zone=web_per_ip:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_per_ip:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# 503 en lugar del 429 por defecto: es un fallo de capacidad temporal, no una
# cuota de cliente, y los buscadores tratan el 503 como "vuelve luego" sin
# penalizar el posicionamiento.
limit_req_status  503;
limit_conn_status 503;

# ── Registro con estado de caché ─────────────────────────────────────────────
# El formato por defecto de Ubuntu no dice si una respuesta salió de la caché,
# así que no había forma de diagnosticar un MISS inesperado después de que
# ocurriera. `cache=` es el campo que faltaba: HIT, MISS, STALE, EXPIRED,
# UPDATING, BYPASS o "-" cuando la petición ni siquiera pasa por una zona de
# caché. `rt`/`urt` separan además el tiempo total del que costó el origen.
#
#   grep -c 'cache=HIT'  /var/log/nginx/kuadrat.access.log
#   awk '{for(i=1;i<=NF;i++) if($i ~ /^cache=/) print $i}' … | sort | uniq -c
log_format kuadrat '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';

# ── Caché de disco ───────────────────────────────────────────────────────────
# En disco a propósito, no en tmpfs: sobrevive al reinicio del contenedor. La
# caché de imágenes de Next vive hoy en un tmpfs de 200 MB que se borra en cada
# despliegue, así que la primera visita tras un deploy vuelve a pagar la
# descarga del original de 1,5 MB y su redimensionado, en el mismo vCPU que
# renderiza páginas.
proxy_cache_path /var/cache/nginx/kuadrat_html
                 levels=1:2 keys_zone=kuadrat_html:20m
                 max_size=500m inactive=60m use_temp_path=off;

proxy_cache_path /var/cache/nginx/kuadrat_img
                 levels=1:2 keys_zone=kuadrat_img:20m
                 max_size=2g inactive=30d use_temp_path=off;

# ── Clave de caché ───────────────────────────────────────────────────────────
# CRÍTICO. El App Router sirve DOS respuestas distintas en la misma URL: el HTML
# completo y la carga RSC que pide el router al navegar por el cliente. Se
# distinguen sólo por cabeceras de petición — y así lo declara Next en su
# `Vary: rsc, next-router-state-tree, next-router-prefetch`.
#
# La clave por defecto de nginx ($scheme$proxy_host$request_uri) las confunde:
# el primero en llegar envenena al otro, y el síntoma es una página que se
# renderiza como JSON en crudo o una navegación cliente que se rompe. Incluir
# aquí las mismas cabeceras que Next declara en Vary es lo que lo evita.
map $http_rsc$http_next_router_prefetch$http_next_router_state_tree $kuadrat_rsc_key {
    default $http_rsc$http_next_router_prefetch$http_next_router_state_tree;
    ''      'html';
}
