# ─────────────────────────────────────────────────────────────────────────────
# Kuadrat — API (Express + Socket.IO)
#
# Destino: /etc/nginx/sites-available/api.140d.art  (+ symlink en sites-enabled/)
# Requiere: /etc/nginx/conf.d/00-kuadrat-shared.conf
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api.140d.art;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.140d.art;

    ssl_certificate     /etc/letsencrypt/live/api.140d.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.140d.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # 15 MB en la API (express.json / multer) + margen para el multipart.
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    limit_conn conn_per_ip 50;

    # ── Socket.IO: subastas en vivo y salas de eventos ───────────────────────
    # Sin rate limit: una sala abierta mantiene UNA conexión y luego habla por
    # ella. Aplicarle `limit_req` cortaría reconexiones legítimas.
    location /socket.io/ {
        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Imágenes servidas por la API ─────────────────────────────────────────
    # Camino de respaldo cuando NEXT_PUBLIC_CDN_URL no está configurada, y ruta
    # de las previsualizaciones de Open Graph. Los basenames son UUID, así que
    # el contenido de una URL nunca cambia.
    location ~ ^/api/(art|others|users/authors)/images/ {
        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "apiimg:$request_uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }

    location / {
        limit_req zone=api_per_ip burst=40 nodelay;

        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El rate limiter de Express lee esta cabecera (`trust proxy = 1`) y toma
        # el valor de más a la derecha, que es el que añade nginx. Que nginx
        # SIEMPRE la añada es también lo que hace segura la exención de tráfico
        # interno en api/middleware/rateLimiter.js: una petición sin esta
        # cabecera no puede venir de fuera.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Sin proxy_cache. La API sirve datos con estado (carrito, pedidos,
        # pujas, stock de ediciones) y ya emite su propio Cache-Control con
        # ETag en los GET públicos, que el navegador respeta. Cachear aquí
        # arriesgaría servir el stock de una obra ya vendida.
    }
}
