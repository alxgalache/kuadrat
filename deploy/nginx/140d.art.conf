# ─────────────────────────────────────────────────────────────────────────────
# Kuadrat — sitio público (Next.js)
#
# Destino: /etc/nginx/sites-available/140d.art  (+ symlink en sites-enabled/)
# Requiere: /etc/nginx/conf.d/00-kuadrat-shared.conf
#
# Los bloques SSL los generó certbot. Si esta config sustituye a una existente,
# CONSERVA las rutas de certificado que ya tuvieras — están comentadas abajo con
# los valores habituales de certbot.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name 140d.art www.140d.art;

    # Certbot deja este location para las renovaciones; no lo redirijas.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 — antes el sitio negociaba sólo HTTP/1.1, lo que limita al
    # navegador a ~6 conexiones paralelas por dominio y obliga a un handshake
    # TLS por cada una. Una página de galería pide decenas de recursos.
    # (Directiva separada: en nginx >= 1.25.1 la forma `listen ... http2` está
    # obsoleta y emite un warning.)
    http2 on;

    server_name 140d.art www.140d.art;

    ssl_certificate     /etc/letsencrypt/live/140d.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reutilizar sesiones TLS ahorra handshakes completos, que es CPU pura en
    # una máquina de 2 vCPU.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Las cabeceras de seguridad las emite Next.js (client/next.config.js).
    # No se duplican aquí para no acabar con dos CSP distintas en la misma
    # respuesta, que es un fallo difícil de diagnosticar.

    client_max_body_size 20m;   # coherente con el límite de 15 MB de la API
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;

    limit_conn conn_per_ip 50;

    # ── Assets con hash de build: inmutables ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_key "static:$request_uri";
        add_header X-Kuadrat-Cache $upstream_cache_status always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── Optimizador de imágenes ──────────────────────────────────────────────
    # La ruta más cara del sitio: por cada variante nueva, Next descarga el
    # original del CDN (~1,5 MB), lo decodifica, lo redimensiona y lo recodifica.
    # Cacheándolo aquí, en disco, eso ocurre UNA vez por variante en la vida del
    # servidor en lugar de una vez por reinicio del contenedor.
    #
    # `proxy_cache_lock` es lo que evita que veinte visitantes simultáneos
    # disparen veinte redimensionados idénticos: sólo el primero va al upstream
    # y el resto espera su resultado.
    location /_next/image {
        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "img:$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }

    # Nota: Socket.IO NO se sirve desde aquí. El cliente abre el websocket
    # contra wss://api.140d.art (ver connect-src en la CSP), así que su bloque
    # vive en api.140d.art.conf.

    # ── Todo lo demás: páginas ───────────────────────────────────────────────
    location / {
        limit_req zone=web_per_ip burst=60 nodelay;

        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_cache kuadrat_html;
        # Deliberadamente SIN `proxy_ignore_headers Cache-Control`: se respeta lo
        # que diga Next. Las páginas públicas (portada, listado, fichas con ISR)
        # mandan `s-maxage` y se cachean; las privadas (admin, pedidos, panel de
        # vendedor) mandan `private, no-store` y nginx no las guarda. Forzar un
        # micro-caché aquí sería mucho más rápido y serviría el panel de un
        # usuario a otro.
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri:$kuadrat_rsc_key";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        # El arreglo de la degradación sucia. Bajo saturación el origen devolvía
        # 500 y cortaba conexiones en seco (EOF / connection reset), que para el
        # visitante es una pestaña en blanco. Con esto nginx sirve la última
        # copia buena mientras el origen se recupera: la web se queda "un poco
        # desactualizada" en vez de caerse.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }
}
