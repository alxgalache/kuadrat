# ─────────────────────────────────────────────────────────────────────────────
# Kuadrat — configuración de nginx de producción
#
# Destino: /etc/nginx/sites-available/140d.art
#          (ya existe el symlink desde sites-enabled/140d.art — no hay que crearlo)
# Requiere: /etc/nginx/conf.d/00-kuadrat-shared.conf
#
# Un único fichero con los seis bloques, igual que la configuración que
# sustituye. Los CUATRO nombres (140d.art, www.140d.art, api.140d.art y
# analytics.140d.art) comparten UN SOLO certificado multi-SAN emitido para
# 140d.art; no existe /etc/letsencrypt/live/api.140d.art/ ni
# /etc/letsencrypt/live/analytics.140d.art/ y referenciarlos impediría arrancar.
# analytics.140d.art se añadió con `certbot --expand` sobre esa misma lineage,
# de modo que la ruta del certificado no cambia (ver deploy/nginx/README.md).
#
# Todo lo marcado «PRESERVADO» viene de la configuración anterior y no debe
# tocarse sin saber por qué está: son valores que sostienen funcionalidad viva.
# ─────────────────────────────────────────────────────────────────────────────


# ═══ 0. Servidor por defecto: cualquier Host que no sea uno de los nuestros ══
#
# Este bloque existe por una razón concreta. Sin `default_server` explícito,
# nginx elige como servidor por defecto de cada dirección:puerto el PRIMERO que
# la escucha —el bloque 1— y entonces la galería contesta a CUALQUIER cabecera
# Host, incluida la IP desnuda de la instancia. Y el DNS apunta directamente a
# la Elastic IP, sin CDN ni proxy delante (docs/dns_and_domain_configuration.md),
# así que el origen es alcanzable sin pasar por el dominio.
#
# Eso no es teórico: el 19/08/2026 un escáner de internet hizo
# `POST https://15.217.1.32/_rsc` con un cuerpo multipart cuyo separador se
# llamaba literalmente «NextRceMitsecOps» —un exploit de la RCE del protocolo
# Flight de RSC (CVE-2025-55182 / CVE-2025-66478)— y llegó hasta el render de
# la página 404 de Next, que reventó con un InvariantError y consumió cuota de
# Sentry (issue 140D-CLIENT-1V). El exploit falló, porque esa RCE está
# parcheada desde Next 16.0.7 y aquí corre una versión posterior; lo que no
# falló fue la ENTREGA. Este bloque corta la entrega.
#
# 444 y no 403: es el código no estándar de nginx que cierra la conexión sin
# enviar NADA. Un 403 le confirma al escáner que hay un servidor vivo detrás y
# además cuesta generarlo y transmitirlo. 444 no le concede ninguna de las dos
# cosas.
#
# El certificado es OBLIGATORIO aquí aunque no se sirva contenido: nginx se
# niega a arrancar si el servidor por defecto de un `listen ... ssl` no lo
# tiene ("no ssl_certificate is defined for the listen ... ssl directive"). Se
# reutiliza el multi-SAN de 140d.art. Quien entre por IP verá un aviso de
# certificado que no coincide y después un corte en seco, que es justo lo
# correcto: por IP este sitio no se sirve.
#
# SIN ipv6only=on, deliberadamente: es un parámetro por dirección:puerto y ya
# lo declara el bloque 1. Repetirlo aborta el arranque. `default_server` sí va
# aquí, y es lo que hace que el bloque 1 deje de ser el default implícito.
#
# `http2` NO es decorativo aquí, y omitirlo fue un error real durante la
# escritura de este bloque: los parámetros de protocolo de `listen` son del
# SOCKET, no del server, así que un `listen 443 ssl` a secas en el bloque que
# se procesa primero entra en conflicto con el `listen 443 ssl http2` del
# bloque 1. nginx lo avisa —"protocol options redefined for 0.0.0.0:443"— pero
# arranca igual, de modo que el sitio entero podría quedarse sin HTTP/2 con la
# única evidencia en un warning del arranque. Los cuatro `listen` de aquí
# deben repetir exactamente los parámetros de protocolo del bloque 1.
#
# `server_name _` no es un comodín en nginx —no existen los comodines de ese
# tipo—: es simplemente un nombre que ningún Host real puede igualar. Lo que
# hace el trabajo es `default_server`; el `_` sólo documenta la intención.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    ssl_certificate /etc/letsencrypt/live/140d.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Log propio y no el del sitio: mezclar el ruido de los escáneres con
    # kuadrat.access.log falsea cualquier recuento de tráfico o de aciertos de
    # caché que se haga sobre él. Aquí además sirve de termómetro de cuánto
    # escaneo llega, que es un dato que hoy no se tiene.
    access_log /var/log/nginx/kuadrat-host-desconocido.access.log kuadrat;

    return 444;
}


# ═══ 1. Sitio público (Next.js) ══════════════════════════════════════════════
server {
    # HTTP/2 como PARÁMETRO de listen, no como directiva propia.
    #
    # La instancia corre nginx 1.24.0 (Ubuntu). La directiva `http2 on;` no
    # existe hasta la 1.25.1: en 1.24 aborta con `unknown directive "http2"` y
    # nginx no arranca. Esta forma funciona en ambas versiones; a partir de
    # 1.25.1 emite un aviso de obsolescencia (sólo un warning, sigue operativa),
    # y entonces sí conviene migrar a la directiva.
    #
    # PRESERVADO: ipv6only=on aparece aquí y sólo aquí. Es un parámetro por
    # dirección:puerto — repetirlo en otro bloque [::]:443 aborta el arranque.
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;

    server_name 140d.art;

    ssl_certificate /etc/letsencrypt/live/140d.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    # NO añadir aquí ssl_session_cache / ssl_session_timeout / ssl_session_tickets:
    # el fichero incluido arriba ya los define y nginx aborta por directiva
    # duplicada. La reutilización de sesiones TLS ya está resuelta.

    server_tokens off;
    access_log /var/log/nginx/kuadrat.access.log kuadrat;
    # El sitio no recibe subidas (van todas a api.140d.art), pero el valor por
    # defecto de nginx es 1 MB y conviene un margen explícito.
    client_max_body_size 10m;

    # ── Página de error propia ───────────────────────────────────────────────
    # Sustituye el texto plano de nginx por una página con la estética de la
    # galería. Es un fichero en disco servido por nginx: no toca Node, así que
    # sigue funcionando cuando el origen está saturado o caído — que es
    # exactamente cuando hace falta.
    #
    # Cubre los cuatro casos con la misma página porque para el visitante
    # significan lo mismo: 503 (limitador o saturación), 502 (origen caído),
    # 504 (origen que no responde a tiempo).
    error_page 502 503 504 /__error.html;
    location = /__error.html {
        root /var/www/kuadrat-errors;
        internal;                      # no accesible por URL directa
        charset utf-8;                 # la página lleva acentos
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;

    # Con HTTP/2 un navegador abre ~1 conexión por origen, así que este número es
    # aproximadamente «cuántas personas caben tras una misma IP». 50 dejaba fuera
    # a un CGNAT de operador móvil — justo el tráfico que llega desde Instagram.
    limit_conn conn_per_ip 200;

    # ── Assets con hash de build: inmutables ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_key "static:$request_uri";
        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }

    # ── Optimizador de imágenes ──────────────────────────────────────────────
    # Todas las imágenes de producto pasan por aquí. Por cada variante nueva,
    # Next descarga el original del CDN (~1,5 MB), lo decodifica, redimensiona y
    # recodifica, en el mismo vCPU que renderiza. Cacheándolo en disco eso pasa
    # UNA vez por variante en la vida del servidor, no una por despliegue.
    #
    # proxy_cache_lock evita que veinte visitantes simultáneos disparen veinte
    # redimensionados idénticos.
    location /_next/image {
        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "img:$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }

    # ── Túnel de Sentry ──────────────────────────────────────────────────────
    # ÚNICO endpoint del sitio público que acepta POST legítimamente. Lo crea
    # `tunnelRoute: "/monitoring"` en client/next.config.js: el navegador manda
    # ahí sus eventos y Next los reenvía a ingest.de.sentry.io, de modo que los
    # bloqueadores de anuncios no corten el reporte de errores del cliente.
    #
    # Tiene bloque propio porque `location /` rechaza todo lo que no sea
    # GET/HEAD (el porqué, ahí abajo). La coincidencia exacta `=` basta aunque
    # la petición real lleve query —`/monitoring?o=…&p=…`—: nginx compara el
    # location contra la RUTA, con la query ya separada.
    #
    # Sin proxy_cache, deliberadamente: cada evento es distinto y cachearlos
    # significaría devolverle a un visitante la respuesta del evento de otro.
    location = /monitoring {
        limit_req zone=web_per_ip burst=20 nodelay;

        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Páginas ──────────────────────────────────────────────────────────────
    location / {
        limit_req zone=web_per_ip burst=100 nodelay;

        # ── Sólo GET y HEAD ──────────────────────────────────────────────────
        # El sitio público no tiene NI UN endpoint que acepte POST: cero Server
        # Actions (`use server` no aparece en todo client/), cero route
        # handlers con POST —el único que existe,
        # app/api/sentry-example-api/route.js, exporta GET— y los formularios
        # hablan por fetch con api.140d.art, que es otro server block con sus
        # propias reglas. La única excepción es el túnel de Sentry, que por eso
        # tiene su `location = /monitoring` justo aquí arriba.
        #
        # Lo que sí llega por POST son escáneres. El 19/08/2026 uno recorrió
        # doce rutas REALES del sitio (/galeria, /tienda, /autores, /legal/*,
        # /eventos, /contacto, /live…) más una inventada (/adfa), cuatro veces
        # cada una, con el cuerpo del exploit del protocolo Flight de RSC.
        # Resultado: 48 peticiones, 48 respuestas 500 — o sea 48 renders de
        # Next reventando. Con `cpus: '0.5'` en el contenedor del cliente eso
        # es la manera barata de tumbar el sitio, y además cada 500 gastaba un
        # evento de Sentry.
        #
        # OJO, esto NO lo cubre el bloque 0: aquellas rutas son las del sitio
        # real, así que el escáner venía por el dominio y no por la IP desnuda.
        # Son dos agujeros distintos y hacen falta los dos parches.
        #
        # 405 y no 444, al revés que en el bloque 0, y es una decisión: allí el
        # destinatario es siempre un escáner y no merece ni respuesta; aquí, el
        # día que alguien añada un POST legítimo y olvide esta regla, un 405 en
        # el log lo explica en diez segundos, mientras que una conexión cerrada
        # en seco parece un fallo de red y cuesta una tarde. El ahorro es el
        # mismo en los dos casos: Node no llega a enterarse.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://kuadrat_client;
        proxy_http_version 1.1;
        # Antes se enviaba Connection "upgrade" en TODAS las peticiones, lo que
        # impedía reutilizar conexiones contra Node en el 99,9 % del tráfico.
        # El mapa deja la cabecera vacía salvo que el cliente pida un upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_cache kuadrat_html;
        # Deliberadamente SIN `proxy_ignore_headers Cache-Control`: se respeta lo
        # que diga Next. Las páginas públicas mandan `s-maxage` y se cachean; el
        # panel de administración, los pedidos y el área de vendedor mandan
        # `private, no-store` y nginx no las guarda. Forzar un micro-caché sería
        # más rápido y podría servirle a un visitante el panel de otro.
        proxy_cache_valid 404 1m;
        # La clave NO lleva $request_method a propósito.
        #
        # nginx sólo cachea GET y HEAD (`proxy_cache_methods`), y trae
        # `proxy_cache_convert_head` activado, que convierte el HEAD en GET
        # justamente para que ambos compartan entrada. Incluir el método en la
        # clave anula esa unificación: cada URL se guardaba DOS veces y un HEAD
        # nunca aprovechaba la copia que había dejado un GET. La documentación
        # de nginx sólo pide añadir $request_method cuando esa conversión se
        # desactiva — que no es el caso.
        proxy_cache_key "$scheme$host$request_uri:$kuadrat_rsc_key";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        # Degradación con contenido en lugar de corte: bajo saturación el origen
        # devolvía 500 y cortaba conexiones en seco, que para el visitante es una
        # pestaña en blanco. Ahora se sirve la última copia buena.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }
}


# ═══ 2. API (Express + Socket.IO) ════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.140d.art;

    ssl_certificate /etc/letsencrypt/live/140d.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;
    access_log /var/log/nginx/kuadrat-api.access.log kuadrat;

    # PRESERVADO — CRÍTICO. La subida de vídeo de eventos
    # (POST /api/admin/events/:id/upload-video) acepta hasta 500 MB en multer
    # (api/routes/admin/eventRoutes.js). Bajar este valor rompe esa subida con un
    # 413 que además se manifiesta a mitad de una carga larga.
    client_max_body_size 550M;
    client_body_timeout  600s;

    # ── Error propio, en JSON ────────────────────────────────────────────────
    # Aquí NO se sirve la página HTML: el cliente hace `res.json()` sobre la
    # respuesta y un cuerpo HTML lo haría fallar con un error de parseo que no
    # se parece en nada a su causa. La forma del cuerpo imita la de
    # `api/utils/response.js` para que el frontend lo trate como cualquier otro
    # error de la API.
    error_page 502 503 504 /__error.json;
    location = /__error.json {
        root /var/www/kuadrat-errors;
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    # Más bajo que en el sitio web a propósito: aquí `client_body_timeout` es de
    # 600 s por las subidas de vídeo, y ese margen es justo lo que aprovecha un
    # ataque de conexiones lentas para retener recursos. 100 sigue siendo holgado
    # para peticiones que duran menos de un segundo.
    limit_conn conn_per_ip 100;

    # ── Socket.IO: subastas en vivo y salas de eventos ───────────────────────
    # Ruta por defecto del servidor (api/app.js no configura `path`).
    # Sin limit_req: una sala abierta mantiene UNA conexión y luego habla por
    # ella; limitarla cortaría reconexiones legítimas.
    location /socket.io/ {
        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Imágenes servidas por la API ─────────────────────────────────────────
    # Camino de las previsualizaciones de Open Graph y respaldo cuando el CDN no
    # está configurado. Los basenames son UUID: una URL nunca cambia de
    # contenido, así que la caché no necesita invalidación.
    location ~ ^/api/(art|others|users/authors)/images/ {
        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache kuadrat_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "apiimg:$request_uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        add_header X-Kuadrat-Cache $upstream_cache_status always;
    }

    location / {
        limit_req zone=api_per_ip burst=60 nodelay;

        proxy_pass http://kuadrat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El rate limiter de Express lee esta cabecera (`trust proxy = 1`). Que
        # nginx la añada SIEMPRE es también lo que hace segura la exención de
        # tráfico interno en api/middleware/rateLimiter.js: una petición sin
        # esta cabecera no puede venir de fuera.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PRESERVADO: timeouts largos y sin buffering de petición, necesarios
        # para las subidas de vídeo. No bajarlos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout  60s;
        proxy_request_buffering off;

        # Sin proxy_cache. La API sirve estado (carrito, pujas, stock de
        # ediciones limitadas); cachearla podría anunciar disponible una obra
        # ya vendida.
    }
}


# ═══ 3. www → apex ═══════════════════════════════════════════════════════════
# PRESERVADO: www redirige, no sirve el sitio. Servirlo en ambos nombres crearía
# contenido duplicado de cara a los buscadores.
server {
    listen 443 ssl http2;

    server_name www.140d.art;
    return 301 https://140d.art$request_uri;

    ssl_certificate /etc/letsencrypt/live/140d.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


# ═══ 4. Analytics (Plausible autoalojado en el Mac mini) ═════════════════════
#
# Este bloque NO existe por comodidad: existe porque es el ÚNICO punto de toda
# la cadena capaz de ver la IP real del visitante.
#
# Plausible corre bajo OrbStack en macOS, y ahí la publicación de puertos entra
# por un proxy en espacio de usuario que SUSTITUYE la IP de origen por la puerta
# de enlace de la red Docker (192.168.97.1). Es arquitectónico, no un ajuste mal
# puesto: ni `network_mode: host` lo evita (orbstack/orbstack#1727). Sin este
# salto, Plausible identificaría a TODOS los visitantes con el mismo hash de IP
# —quedarían deduplicados sólo por User-Agent— y la geolocalización sería
# siempre vacía. Datos falsos, no datos imprecisos.
#
# Aquí nginx corre sobre un Linux normal y sí ve la IP real. La pone en
# X-Forwarded-For, y Plausible toma el valor de MÁS A LA IZQUIERDA
# (lib/plausible_web/remote_ip.ex, `List.first`), así que la IP añadida después
# por OrbStack queda detrás y es inofensiva.
#
# El endpoint de ingesta viaja cocido dentro del script generado como
# `BASE_URL/api/event`, y BASE_URL gobierna ADEMÁS dónde vive el dashboard y la
# comprobación CSWSH de los WebSockets. Por eso hay un solo nombre para las dos
# cosas y todo —panel incluido— pasa por aquí; separarlos en dos subdominios
# rompería el LiveView del panel.
server {
    listen 443 ssl http2;
    # SIN ipv6only=on: es un parámetro por dirección:puerto y ya está declarado
    # en el bloque 1. Repetirlo aborta el arranque de nginx.
    listen [::]:443 ssl http2;

    server_name analytics.140d.art;

    ssl_certificate /etc/letsencrypt/live/140d.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/140d.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;
    access_log /var/log/nginx/kuadrat-analytics.access.log kuadrat;
    client_max_body_size 1m;

    # El destino es un DDNS: su IP cambia. Sin `resolver` + variable en
    # proxy_pass, nginx resolvería UNA sola vez al arrancar y seguiría enviando
    # a la IP vieja hasta el siguiente reload — un fallo que aparece semanas
    # después y no se parece en nada a su causa. 169.254.169.253 es el resolver
    # link-local de la VPC de AWS.
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 3s;

    # ⚠️  SUSTITUIR por el hostname DDNS real del router ASUS.
    set $plausible_casa https://m1140d.asuscomm.com;

    # ── Cabeceras, declaradas UNA vez a nivel de servidor ────────────────────
    # nginx hereda proxy_set_header de un nivel al siguiente SÓLO si el nivel
    # inferior no declara ninguna. Por eso los `location` de abajo ajustan
    # timeouts pero no tocan cabeceras: en cuanto uno declarase una, perdería
    # las cinco.
    #
    # $remote_addr y NO $proxy_add_x_forwarded_for: el segundo ANTEPONE lo que
    # mande el cliente, y como Plausible coge el primer valor de la lista sin
    # verificar nada, cualquier visitante podría declarar la IP y el país que
    # quisiera. Sobrescribir es lo que cierra ese agujero.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              analytics.140d.art;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_http_version 1.1;

    # El otro extremo presenta el certificado que NPM emitió para este mismo
    # nombre. El salto cruza internet abierto y transporta IPs de visitantes,
    # así que se verifica. Si una renovación dejara un hueco, el fallo sale en
    # kuadrat-analytics.access.log como 502 y sólo afecta a la analítica.
    proxy_ssl_server_name on;
    proxy_ssl_name        analytics.140d.art;
    proxy_ssl_verify      on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    limit_conn conn_per_ip 20;

    # ── Ingesta de eventos ───────────────────────────────────────────────────
    # El beacon es «dispara y olvida»: al visitante no le afecta que falle. Pero
    # una conexión colgada 60 s sí consume recursos AQUÍ, en la instancia que
    # además sirve la galería. Timeouts cortos.
    location = /api/event {
        proxy_pass $plausible_casa$request_uri;
        proxy_connect_timeout 3s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }

    # ── WebSocket del panel (Phoenix LiveView) ───────────────────────────────
    # Timeout LARGO, deliberadamente distinto del anterior: con los 5 s del
    # beacon, la conexión del dashboard moriría cada 5 segundos y el panel se
    # pasaría la vida reconectando. Mismo valor que /socket.io/ en el bloque 2.
    location /live/websocket {
        proxy_pass $plausible_casa$request_uri;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Resto: panel, script del tracker, estáticos ──────────────────────────
    # Sin proxy_cache en ningún location de este bloque. El script pa-*.js viaja
    # con `cache-control: public, max-age=60` y quien debe respetarlo es el
    # navegador; cachearlo aquí añadiría una capa más donde un id revocado
    # seguiría vivo.
    location / {
        proxy_pass $plausible_casa$request_uri;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}


# ═══ 5. Puerto 80 → HTTPS ════════════════════════════════════════════════════
# Se conserva la forma que generó certbot. El plugin de nginx reconoce estos
# bloques al renovar; reescribirlos en otro estilo puede complicar la renovación
# automática, que hoy funciona.
server {
    if ($host = 140d.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name 140d.art;
    return 404; # managed by Certbot
}

server {
    if ($host = api.140d.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.140d.art;
    return 404; # managed by Certbot
}

server {
    if ($host = www.140d.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name www.140d.art;
    return 404; # managed by Certbot
}

# Necesario para que el reto HTTP-01 de certbot pueda emitir/renovar el SAN de
# analytics.140d.art. El plugin inserta su location temporal por encima de este
# `if` y lo retira al terminar.
server {
    if ($host = analytics.140d.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name analytics.140d.art;
    return 404; # managed by Certbot
}
